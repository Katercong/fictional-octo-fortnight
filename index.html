<!-- 
  NebulaRAG - AI 知识库问答助手
  依赖 CDN:
  - TailwindCSS 3.4: https://cdn.tailwindcss.com
  - marked.js 12.0: https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js
  - highlight.js 11.9: https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js
  - highlight.js CSS: https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css
  - Inter Font: https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700
  - Noto Sans SC: https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NebulaRAG - AI 知识库问答助手</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --primary-50: #E0E7FF;
      
      --bg-primary: #FFFFFF;
      --bg-secondary: #F9FAFB;
      --bg-tertiary: #F3F4F6;
      --bg-sidebar: #111827;
      
      --text-primary: #111827;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --text-inverse: #F9FAFB;
      
      --border: #E5E7EB;
      --border-hover: #D1D5DB;
      
      --success: #10B981;
      --error: #EF4444;
      --warning: #F59E0B;
      
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
      
      --sidebar-width: 280px;
      --header-height: 64px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: var(--primary-50);
      color: var(--primary);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: var(--radius-full);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }

    .fade-in-up {
      animation: fadeInUp var(--transition-slow) ease-out forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes typing {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    @keyframes slideOutRight {
      from { transform: translateX(0); }
      to { transform: translateX(100%); }
    }

    .toast-enter {
      animation: slideInRight var(--transition-normal) ease-out;
    }

    .toast-exit {
      animation: slideOutRight var(--transition-normal) ease-in;
    }

    #loginPage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--primary-light) 100%);
      padding: 20px;
    }

    .login-card {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 48px;
      width: 100%;
      max-width: 420px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), #7C3AED);
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: var(--primary-light);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all var(--transition-fast);
      background: var(--bg-primary);
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .input-field::placeholder {
      color: var(--text-tertiary);
    }

    .btn-primary {
      width: 100%;
      padding: 14px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .demo-account {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 24px;
    }

    .demo-account-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .demo-account-item:hover {
      background: var(--bg-primary);
    }

    .demo-account-item .username {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 14px;
    }

    .demo-account-item .password {
      color: var(--text-secondary);
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .demo-account-item .role-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 500;
    }

    #appPage {
      display: none;
      height: 100vh;
    }

    .app-layout {
      display: flex;
      height: 100%;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      color: var(--text-inverse);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform var(--transition-normal);
      z-index: 50;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .sidebar-logo-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .sidebar-logo-text {
      font-size: 16px;
      font-weight: 600;
    }

    .role-badge-sidebar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.1);
      border-radius: var(--radius-full);
      font-size: 12px;
      color: var(--text-inverse);
    }

    .role-badge-sidebar .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .btn-new-chat {
      margin: 16px 20px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.1);
      color: var(--text-inverse);
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-new-chat:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.3);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .chat-item {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      group: true;
    }

    .chat-item:hover {
      background: rgba(255,255,255,0.1);
    }

    .chat-item.active {
      background: rgba(79, 70, 229, 0.3);
    }

    .chat-item-title {
      font-size: 14px;
      color: var(--text-inverse);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .chat-item-actions {
      display: none;
      gap: 4px;
    }

    .chat-item:hover .chat-item-actions {
      display: flex;
    }

    .chat-item-btn {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-inverse);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background var(--transition-fast);
    }

    .chat-item-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      transition: background var(--transition-fast);
      cursor: pointer;
    }

    .user-info:hover {
      background: rgba(255,255,255,0.1);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
    }

    .user-name {
      font-size: 14px;
      font-weight: 500;
    }

    .user-role {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-primary);
    }

    .main-header {
      height: var(--header-height);
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-menu {
      display: none;
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 20px;
      transition: all var(--transition-fast);
    }

    .btn-menu:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .header-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 18px;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px;
    }

    .empty-state-icon {
      width: 120px;
      height: 120px;
      background: var(--primary-light);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 24px;
    }

    .empty-state-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .empty-state-desc {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 400px;
    }

    .quick-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
      justify-content: center;
    }

    .quick-prompt {
      padding: 10px 16px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .quick-prompt:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .message-wrapper {
      margin-bottom: 24px;
      animation: fadeInUp var(--transition-slow) ease-out;
    }

    .message-wrapper.user {
      display: flex;
      justify-content: flex-end;
    }

    .message-wrapper.assistant {
      display: flex;
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 75%;
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      line-height: 1.7;
      position: relative;
    }

    .message-wrapper.user .message-bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-wrapper.assistant .message-bubble {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 6px;
      padding: 0 4px;
    }

    .message-wrapper.user .message-time {
      text-align: right;
    }

    .message-wrapper.assistant .message-time {
      text-align: left;
    }

    .message-content p {
      margin-bottom: 12px;
    }

    .message-content p:last-child {
      margin-bottom: 0;
    }

    .message-content ul,
    .message-content ol {
      margin: 12px 0;
      padding-left: 24px;
    }

    .message-content li {
      margin-bottom: 8px;
    }

    .message-content strong {
      font-weight: 600;
    }

    .message-content a {
      color: var(--primary);
      text-decoration: underline;
    }

    .message-wrapper.user .message-content a {
      color: white;
    }

    .message-content code {
      background: rgba(0,0,0,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }

    .message-wrapper.assistant .message-content code {
      background: var(--bg-tertiary);
    }

    .message-content pre {
      margin: 12px 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
    }

    .message-content pre code {
      display: block;
      padding: 16px;
      background: #1E1E1E;
      color: #D4D4D4;
      font-size: 13px;
      line-height: 1.6;
      overflow-x: auto;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #2D2D2D;
      font-size: 12px;
      color: #9CA3AF;
    }

    .btn-copy {
      padding: 4px 10px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: var(--radius-sm);
      color: #D4D4D4;
      font-size: 12px;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-copy:hover {
      background: rgba(255,255,255,0.2);
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 16px 20px;
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--text-tertiary);
      border-radius: 50%;
      animation: typing 1.4s ease-in-out infinite;
    }

    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    .skeleton {
      background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-secondary) 50%, var(--bg-tertiary) 75%);
      background-size: 200% 100%;
      animation: pulse 1.5s ease-in-out infinite;
      border-radius: var(--radius-sm);
    }

    .skeleton-message {
      height: 80px;
      width: 60%;
      margin-bottom: 16px;
      border-radius: var(--radius-lg);
    }

    .input-area {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-primary);
    }

    .file-upload-zone {
      display: none;
      margin-bottom: 12px;
      padding: 16px;
      border: 2px dashed var(--border);
      border-radius: var(--radius-md);
      text-align: center;
      transition: all var(--transition-fast);
      cursor: pointer;
    }

    .file-upload-zone.active {
      display: block;
    }

    .file-upload-zone.dragover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .file-upload-zone.has-file {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.05);
    }

    .file-upload-zone-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .file-upload-zone-text {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .file-upload-zone-text strong {
      color: var(--primary);
    }

    .input-container {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: var(--bg-secondary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      transition: all var(--transition-fast);
    }

    .input-container:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .input-actions {
      display: flex;
      gap: 4px;
    }

    .btn-action {
      width: 36px;
      height: 36px;
      background: none;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-tertiary);
      font-size: 18px;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.6;
      background: transparent;
      max-height: 150px;
      min-height: 24px;
    }

    #messageInput::placeholder {
      color: var(--text-tertiary);
    }

    .btn-send {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      color: white;
      font-size: 18px;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-send:hover {
      background: var(--primary-hover);
      transform: scale(1.05);
    }

    .btn-send:active {
      transform: scale(0.95);
    }

    .btn-send:disabled {
      background: var(--text-tertiary);
      cursor: not-allowed;
      transform: none;
    }

    .btn-send .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .scroll-to-bottom {
      position: fixed;
      bottom: 120px;
      right: 40px;
      width: 44px;
      height: 44px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 50%;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
      z-index: 40;
    }

    .scroll-to-bottom:hover {
      background: var(--bg-secondary);
      color: var(--primary);
      transform: translateY(-2px);
    }

    .scroll-to-bottom.visible {
      display: flex;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 14px 20px;
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 300px;
      max-width: 400px;
      font-size: 14px;
      border-left: 4px solid;
    }

    .toast.success {
      border-color: var(--success);
    }

    .toast.error {
      border-color: var(--error);
    }

    .toast.warning {
      border-color: var(--warning);
    }

    .toast-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .toast-message {
      flex: 1;
      color: var(--text-primary);
    }

    .toast-close {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .toast-close:hover {
      color: var(--text-primary);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.open {
        display: block;
      }

      .btn-menu {
        display: flex;
      }

      .chat-area {
        padding: 16px;
      }

      .input-area {
        padding: 12px 16px 16px;
      }

      .message-bubble {
        max-width: 85%;
      }

      .scroll-to-bottom {
        right: 16px;
        bottom: 100px;
      }

      .empty-state-icon {
        width: 80px;
        height: 80px;
        font-size: 32px;
      }

      .empty-state-title {
        font-size: 18px;
      }

      .quick-prompts {
        flex-direction: column;
        align-items: center;
      }
    }

    @media (max-width: 480px) {
      .message-bubble {
        max-width: 90%;
        padding: 12px 16px;
      }

      .header-subtitle {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="loginPage">
    <div class="login-card fade-in-up">
      <div class="login-logo">🔮</div>
      <h1 style="text-align:center; font-size:24px; font-weight:700; margin-bottom:8px;">NebulaRAG</h1>
      <p style="text-align:center; color:var(--text-secondary); margin-bottom:32px; font-size:14px;">AI 知识库问答助手</p>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div style="margin-bottom:16px;">
          <input type="text" id="usernameInput" class="input-field" placeholder="用户名" autocomplete="username" required>
        </div>
        <div style="margin-bottom:24px;">
          <input type="password" id="passwordInput" class="input-field" placeholder="密码" autocomplete="current-password" required>
        </div>
        <button type="submit" id="loginBtn" class="btn-primary">
          <span>登录</span>
        </button>
      </form>
      
      <div class="demo-account">
        <p style="font-size:12px; color:var(--text-tertiary); margin-bottom:12px; font-weight:500;">演示账号（点击填充）</p>
        <div class="demo-account-item" onclick="fillDemo('admin', 'admin123')">
          <div>
            <span class="username">admin</span>
            <span class="password">admin123</span>
          </div>
          <span class="role-badge">管理员</span>
        </div>
        <div class="demo-account-item" onclick="fillDemo('employee', 'emp123')">
          <div>
            <span class="username">employee</span>
            <span class="password">emp123</span>
          </div>
          <span class="role-badge">员工</span>
        </div>
      </div>
    </div>
  </div>

  <div id="appPage">
    <div class="app-layout">
      <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
      
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <div class="sidebar-logo-icon">🔮</div>
            <span class="sidebar-logo-text">NebulaRAG</span>
          </div>
          <div class="role-badge-sidebar" id="roleBadge">
            <span class="dot"></span>
            <span id="roleName">-</span>
          </div>
        </div>
        
        <button class="btn-new-chat" onclick="createNewChat()">
          <span>＋</span>
          <span>新建对话</span>
        </button>
        
        <div class="chat-list" id="chatList"></div>
        
        <div class="sidebar-footer">
          <div class="user-info" onclick="handleLogout()">
            <div class="user-avatar" id="userAvatar">-</div>
            <div>
              <div class="user-name" id="userName">-</div>
              <div class="user-role">点击退出登录</div>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="main-header">
          <div class="header-left">
            <button class="btn-menu" onclick="toggleSidebar()">☰</button>
            <div>
              <div class="header-title" id="chatTitle">新对话</div>
              <div class="header-subtitle" id="chatSubtitle">NebulaRAG AI 助手</div>
            </div>
          </div>
          <div class="header-right">
            <button class="btn-icon" onclick="clearCurrentChat()" title="清空对话">🗑️</button>
          </div>
        </header>

        <div class="chat-area" id="chatArea">
          <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">💬</div>
            <h2 class="empty-state-title">开始新的对话</h2>
            <p class="empty-state-desc">我可以帮你回答基于知识库的问题，支持文档上传和智能问答</p>
            <div class="quick-prompts">
              <button class="quick-prompt" onclick="useQuickPrompt('知识库中有哪些文档？')">📚 知识库文档</button>
              <button class="quick-prompt" onclick="useQuickPrompt('请帮我总结一下最近的文档')">📝 文档总结</button>
              <button class="quick-prompt" onclick="useQuickPrompt('有哪些常见问题？')">❓ 常见问题</button>
            </div>
          </div>
        </div>

        <div class="input-area">
          <div class="file-upload-zone" id="fileUploadZone">
            <div class="file-upload-zone-icon">📁</div>
            <div class="file-upload-zone-text">
              拖拽文件到此处或 <strong>点击上传</strong>
            </div>
            <div class="file-upload-zone-text" style="font-size:12px; margin-top:4px;">
              支持 PDF、DOCX、TXT 格式
            </div>
            <input type="file" id="fileInput" accept=".pdf,.docx,.txt" style="display:none">
          </div>
          
          <div class="input-container">
            <div class="input-actions">
              <button class="btn-action" onclick="toggleFileUpload()" title="上传文件">📎</button>
            </div>
            <textarea id="messageInput" placeholder="输入你的问题..." rows="1" onkeydown="handleInputKeydown(event)" oninput="autoResize(this)"></textarea>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()">
              <span>➤</span>
            </button>
          </div>
        </div>
      </main>
    </div>

    <button class="scroll-to-bottom" id="scrollBtn" onclick="scrollToBottom()">↓</button>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  
  <script>
    const API_BASE = window.location.origin;
    
    let state = {
      token: localStorage.getItem('access_token'),
      user: null,
      chats: JSON.parse(localStorage.getItem('chats') || '[]'),
      currentChatId: null,
      selectedFile: null,
      isSending: false,
      chatHistory: []
    };

    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
      gfm: true
    });

    function init() {
      if (state.token) {
        verifyToken();
      } else {
        showLoginPage();
      }
    }

    function showLoginPage() {
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('appPage').style.display = 'none';
    }

    function showAppPage() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('appPage').style.display = 'block';
      renderChatList();
      if (state.chats.length > 0 && !state.currentChatId) {
        selectChat(state.chats[0].id);
      }
    }

    async function verifyToken() {
      try {
        const response = await fetch(`${API_BASE}/users/me`, {
          headers: { 'Authorization': `Bearer ${state.token}` }
        });
        if (response.ok) {
          state.user = await response.json();
          updateUserUI();
          showAppPage();
        } else {
          logout();
        }
      } catch {
        logout();
      }
    }

    function updateUserUI() {
      if (!state.user) return;
      const userNameEl = document.getElementById('userName');
      const userAvatarEl = document.getElementById('userAvatar');
      const roleNameEl = document.getElementById('roleName');
      if (userNameEl) userNameEl.textContent = state.user.username;
      if (userAvatarEl && state.user.username) userAvatarEl.textContent = state.user.username[0].toUpperCase();
      if (roleNameEl) roleNameEl.textContent = `kb_${state.user.role}`;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('loginBtn');
      
      if (!username || !password) {
        showToast('请输入用户名和密码', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>登录中...</span>';

      try {
        const response = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
        });

        const data = await response.json();

        if (response.ok && data.access_token) {
          state.token = data.access_token;
          localStorage.setItem('access_token', state.token);
          state.user = { username, role: '' };
          await verifyToken();
          showToast('登录成功', 'success');
        } else {
          showToast(data.detail || '登录失败', 'error');
        }
      } catch (err) {
        showToast('网络错误: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>登录</span>';
      }
    }

    function fillDemo(username, password) {
      document.getElementById('usernameInput').value = username;
      document.getElementById('passwordInput').value = password;
    }

    function logout() {
      state.token = null;
      state.user = null;
      localStorage.removeItem('access_token');
      showLoginPage();
    }

    function handleLogout() {
      if (confirm('确定要退出登录吗？')) {
        logout();
        showToast('已退出登录', 'success');
      }
    }

    function createNewChat() {
      const chat = {
        id: Date.now().toString(),
        title: '新对话',
        messages: [],
        createdAt: new Date().toISOString()
      };
      state.chats.unshift(chat);
      saveChats();
      selectChat(chat.id);
      renderChatList();
    }

    function selectChat(chatId) {
      state.currentChatId = chatId;
      const chat = state.chats.find(c => c.id === chatId);
      if (chat) {
        state.chatHistory = chat.messages;
        document.getElementById('chatTitle').textContent = chat.title;
        renderMessages();
      }
      renderChatList();
      closeSidebar();
    }

    function deleteChat(chatId, e) {
      e.stopPropagation();
      if (!confirm('确定要删除这个对话吗？')) return;
      
      state.chats = state.chats.filter(c => c.id !== chatId);
      saveChats();
      
      if (state.currentChatId === chatId) {
        state.currentChatId = null;
        state.chatHistory = [];
        if (state.chats.length > 0) {
          selectChat(state.chats[0].id);
        } else {
          createNewChat();
        }
      }
      renderChatList();
    }

    function renameChat(chatId, e) {
      e.stopPropagation();
      const chat = state.chats.find(c => c.id === chatId);
      if (!chat) return;
      
      const newTitle = prompt('请输入新的对话标题:', chat.title);
      if (newTitle && newTitle.trim()) {
        chat.title = newTitle.trim();
        saveChats();
        renderChatList();
        if (state.currentChatId === chatId) {
          document.getElementById('chatTitle').textContent = chat.title;
        }
      }
    }

    function clearCurrentChat() {
      if (!state.currentChatId) return;
      if (!confirm('确定要清空当前对话吗？')) return;
      
      const chat = state.chats.find(c => c.id === state.currentChatId);
      if (chat) {
        chat.messages = [];
        chat.title = '新对话';
        state.chatHistory = [];
        saveChats();
        renderMessages();
        renderChatList();
        document.getElementById('chatTitle').textContent = '新对话';
      }
    }

    function saveChats() {
      localStorage.setItem('chats', JSON.stringify(state.chats));
    }

    function renderChatList() {
      const container = document.getElementById('chatList');
      container.innerHTML = state.chats.map(chat => `
        <div class="chat-item ${chat.id === state.currentChatId ? 'active' : ''}" onclick="selectChat('${chat.id}')">
          <div class="chat-item-title">${escapeHtml(chat.title)}</div>
          <div class="chat-item-actions">
            <button class="chat-item-btn" onclick="renameChat('${chat.id}', event)" title="重命名">✏️</button>
            <button class="chat-item-btn" onclick="deleteChat('${chat.id}', event)" title="删除">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function renderMessages() {
      const chatArea = document.getElementById('chatArea');
      const emptyState = document.getElementById('emptyState');
      
      if (state.chatHistory.length === 0) {
        emptyState.style.display = 'flex';
        return;
      }
      
      emptyState.style.display = 'none';
      chatArea.innerHTML = state.chatHistory.map((msg, i) => {
        if (msg.role === 'user') {
          return `
            <div class="message-wrapper user" style="animation-delay: ${i * 50}ms">
              <div>
                <div class="message-bubble">
                  <div class="message-content">${escapeHtml(msg.content)}</div>
                </div>
                <div class="message-time">${formatTime(msg.timestamp)}</div>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="message-wrapper assistant" style="animation-delay: ${i * 50}ms">
              <div>
                <div class="message-bubble">
                  <div class="message-content">${renderMarkdown(msg.content)}</div>
                </div>
                <div class="message-time">${formatTime(msg.timestamp)}</div>
              </div>
            </div>
          `;
        }
      }).join('');
      
      addCopyButtons();
      scrollToBottom();
    }

    function addMessage(role, content) {
      const chat = state.chats.find(c => c.id === state.currentChatId);
      if (chat) {
        const msg = { role, content, timestamp: new Date().toISOString() };
        chat.messages.push(msg);
        state.chatHistory = chat.messages;
        
        if (role === 'user' && chat.messages.length === 1) {
          chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
          document.getElementById('chatTitle').textContent = chat.title;
          renderChatList();
        }
        
        saveChats();
        appendMessageToDOM(msg);
      }
    }

    function appendMessageToDOM(msg) {
      const chatArea = document.getElementById('chatArea');
      const emptyState = document.getElementById('emptyState');
      if (emptyState) {
        emptyState.style.display = 'none';
      }
      
      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper ${msg.role} fade-in-up`;
      
      if (msg.role === 'user') {
        wrapper.innerHTML = `
          <div>
            <div class="message-bubble">
              <div class="message-content">${escapeHtml(msg.content)}</div>
            </div>
            <div class="message-time">${formatTime(msg.timestamp)}</div>
          </div>
        `;
      } else {
        wrapper.innerHTML = `
          <div>
            <div class="message-bubble">
              <div class="message-content">${renderMarkdown(msg.content)}</div>
            </div>
            <div class="message-time">${formatTime(msg.timestamp)}</div>
          </div>
        `;
      }
      
      chatArea.appendChild(wrapper);
      addCopyButtons();
      scrollToBottom();
    }

    function showTypingIndicator() {
      const chatArea = document.getElementById('chatArea');
      if (!chatArea) return;
      
      const indicator = document.createElement('div');
      indicator.className = 'message-wrapper assistant fade-in-up';
      indicator.id = 'typingIndicator';
      indicator.innerHTML = `
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      chatArea.appendChild(indicator);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    async function sendMessage() {
      if (state.isSending) return;
      
      const input = document.getElementById('messageInput');
      const question = input.value.trim();
      
      if (!question && !state.selectedFile) {
        showToast('请输入问题或上传文件', 'warning');
        return;
      }

      if (!state.currentChatId) {
        createNewChat();
      }

      state.isSending = true;
      updateSendButton(true);

      const displayQuestion = question || '请总结这个文件的内容';
      addMessage('user', displayQuestion);
      input.value = '';
      autoResize(input);

      showTypingIndicator();

      try {
        const formData = new FormData();
        formData.append('question', question || '请总结这个文件的内容');
        formData.append('history', JSON.stringify(state.chatHistory.slice(0, -1)));
        
        if (state.selectedFile) {
          formData.append('file', state.selectedFile);
        }

        const response = await fetch(`${API_BASE}/chat`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${state.token}` },
          body: formData
        });

        removeTypingIndicator();

        if (!response.ok) {
          if (response.status === 401) {
            showToast('登录已过期，请重新登录', 'error');
            setTimeout(logout, 1500);
            return;
          }
          let errorMessage = '服务器错误';
          try {
            const data = await response.json();
            errorMessage = data.detail || errorMessage;
          } catch (e) {
            // 忽略解析错误
          }
          addMessage('assistant', `错误: ${errorMessage}`);
          return;
        }

        const data = await response.json();
        if (data.answer) {
          addMessage('assistant', data.answer);
        } else {
          addMessage('assistant', '未收到有效回答');
        }
      } catch (err) {
        removeTypingIndicator();
        addMessage('assistant', `请求失败: ${err.message}`);
      } finally {
        state.isSending = false;
        updateSendButton(false);
        clearFileSelection();
      }
    }

    function updateSendButton(sending) {
      const btn = document.getElementById('sendBtn');
      if (sending) {
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';
      } else {
        btn.disabled = false;
        btn.innerHTML = '<span>➤</span>';
      }
    }

    function handleInputKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
    }

    function toggleFileUpload() {
      const zone = document.getElementById('fileUploadZone');
      zone.classList.toggle('active');
    }

    function clearFileSelection() {
      state.selectedFile = null;
      const zone = document.getElementById('fileUploadZone');
      zone.classList.remove('has-file', 'active');
      zone.querySelector('.file-upload-zone-text').innerHTML = '拖拽文件到此处或 <strong>点击上传</strong>';
      document.getElementById('fileInput').value = '';
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        state.selectedFile = file;
        const zone = document.getElementById('fileUploadZone');
        zone.classList.add('has-file');
        zone.querySelector('.file-upload-zone-text').innerHTML = `已选择: <strong>${escapeHtml(file.name)}</strong>`;
      }
    });

    document.getElementById('fileUploadZone').addEventListener('click', function() {
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileUploadZone').addEventListener('dragover', function(e) {
      e.preventDefault();
      this.classList.add('dragover');
    });

    document.getElementById('fileUploadZone').addEventListener('dragleave', function() {
      this.classList.remove('dragover');
    });

    document.getElementById('fileUploadZone').addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('dragover');
      
      const file = e.dataTransfer.files[0];
      if (file) {
        const ext = file.name.toLowerCase().split('.').pop();
        if (['pdf', 'docx', 'txt'].includes(ext)) {
          state.selectedFile = file;
          this.classList.add('has-file');
          this.querySelector('.file-upload-zone-text').innerHTML = `已选择: <strong>${escapeHtml(file.name)}</strong>`;
        } else {
          showToast('不支持的文件格式，请上传 PDF、DOCX 或 TXT', 'error');
        }
      }
    });

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    function closeSidebar() {
      if (window.innerWidth <= 768) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
      }
    }

    function scrollToBottom() {
      const chatArea = document.getElementById('chatArea');
      if (chatArea) {
        chatArea.scrollTop = chatArea.scrollHeight;
      }
    }

    function useQuickPrompt(prompt) {
      const input = document.getElementById('messageInput');
      if (input) {
        input.value = prompt;
        sendMessage();
      }
    }

    function renderMarkdown(text) {
      try {
        let html = marked.parse(text);
        return html;
      } catch {
        return escapeHtml(text);
      }
    }

    function addCopyButtons() {
      document.querySelectorAll('pre code').forEach(block => {
        if (block.parentElement.querySelector('.code-header')) return;
        
        const pre = block.parentElement;
        const code = block.textContent;
        const lang = block.className.replace('hljs ', '').replace('language-', '') || 'code';
        
        const header = document.createElement('div');
        header.className = 'code-header';
        header.innerHTML = `
          <span>${lang}</span>
          <button class="btn-copy" onclick="copyCode(this)">📋 复制</button>
        `;
        
        pre.insertBefore(header, block);
      });
    }

    function copyCode(btn) {
      const code = btn.closest('pre').querySelector('code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = '✓ 已复制';
        setTimeout(() => btn.textContent = '📋 复制', 2000);
      }).catch(() => {
        showToast('复制失败', 'error');
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      
      const toast = document.createElement('div');
      toast.className = `toast ${type} toast-enter`;
      
      const icons = {
        success: '✓',
        error: '✕',
        warning: '⚠',
        info: 'ℹ'
      };
      
      toast.innerHTML = `
        <span class="toast-icon">${icons[type] || icons.info}</span>
        <span class="toast-message">${escapeHtml(message)}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
      `;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        setTimeout(() => {
          if (toast.parentNode) {
            toast.remove();
          }
        }, 300);
      }, 3000);
    }

    window.addEventListener('resize', function() {
      if (window.innerWidth > 768) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (sidebar) sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('open');
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      // 初始化聊天
      init();
      
      // 绑定滚动事件
      const chatArea = document.getElementById('chatArea');
      if (chatArea) {
        chatArea.addEventListener('scroll', function() {
          const scrollBtn = document.getElementById('scrollBtn');
          const isNearBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 100;
          if (scrollBtn) {
            scrollBtn.classList.toggle('visible', !isNearBottom);
          }
        });
      }
    });
  </script>
</body>
</html>
